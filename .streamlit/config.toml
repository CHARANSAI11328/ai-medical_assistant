[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "developer"
showErrorDetails = "full"

[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#080c16"
secondaryBackgroundColor = "#0f172a"
textColor = "#f8fafc"
font = "sans serif"
